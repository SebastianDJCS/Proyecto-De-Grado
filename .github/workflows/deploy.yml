name: Continuous Deployment to Azure

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Azure VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 1. Entrar a la carpeta exacta en la VM
            cd ~/Proyecto-De-Grado
            
            # 2. Descargar los cambios más recientes de GitHub
            git pull origin main
            
            # 3. Reconstruir e iniciar los contenedores
            docker compose up -d --build
            
            # 4. Limpiar imágenes antiguas para liberar espacio
            docker image prune -f
