server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA de React: cualquier ruta que no sea un archivo real -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend FastAPI (nombre del servicio en la red de Docker).
    # proxy_pass sin ruta conserva la URI original (/api/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # El solver global puede tardar hasta 240 s: no cortar la peticion.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        client_max_body_size 20m;
    }
}
