services:
  backend:
    build:
      context: ./backend
    container_name: uctp-backend
    ports:
      - "8000:8000"
    env_file:
      # DATABASE_URL y CORS_ORIGINS (crea este archivo desde backend/.env.example)
      - ./backend/.env
    environment:
      # Tope de tiempo del solver global (segundos).
      # < 120 porque el rewrite externo de Vercel (proxy /api -> Azure) corta
      # la peticion a los 120 s. El solver tarda ~20 s, sobra margen.
      SOLVER_MAX_TIME_SECONDS: ${SOLVER_MAX_TIME_SECONDS:-100}
      # Hilos de búsqueda del solver: 0 = usar todos los vCPU disponibles.
      # Pon un número (2, 4...) si quieres limitarlos.
      SOLVER_WORKERS: ${SOLVER_WORKERS:-0}
      # Límite de RAM del solver en MB: 0 = sin límite.
      # Pon un valor (ej. 1500) si tu VM tiene poca RAM para evitar OOM.
      SOLVER_MAX_MEMORY_MB: ${SOLVER_MAX_MEMORY_MB:-0}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
