services:
  backend:
    build:
      context: ./backend
    container_name: uctp-backend
    ports:
      - "8000:8000"
    env_file:
      # DATABASE_URL y CORS_ORIGINS (crea este archivo desde backend/.env.example)
      - ./backend/.env
    environment:
      # Tope de tiempo del solver global (segundos).
      # 240 < 300 = duración máxima de la function de Vercel que hace de proxy
      # (/api/* -> Azure), para que la petición nunca muera antes que el solver.
      SOLVER_MAX_TIME_SECONDS: ${SOLVER_MAX_TIME_SECONDS:-240}
      # Hilos de búsqueda del solver: 0 = usar todos los vCPU disponibles.
      # Pon un número (2, 4...) si quieres limitarlos.
      SOLVER_WORKERS: ${SOLVER_WORKERS:-0}
      # Límite de RAM del solver en MB: 0 = sin límite.
      # Pon un valor (ej. 1500) si tu VM tiene poca RAM para evitar OOM.
      SOLVER_MAX_MEMORY_MB: ${SOLVER_MAX_MEMORY_MB:-0}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
